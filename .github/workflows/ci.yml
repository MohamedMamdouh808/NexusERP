name: CI

# Mandatory checks. These jobs are declared as required status checks in the branch
# protection rule (T074), so a PR cannot merge with any of them failing.
#
# No job here pushes an image to a registry, deploys anything, or produces a release.
# T111 and `.github/workflows/__tests__/ci-no-deploy.spec.ts` assert that structurally
# rather than by substring, and this file is kept free of `docker push`, a registry login
# step, and any build-and-push action with push enabled.

on:
  push:
    branches: ["main", "001-platform-foundation"]
  pull_request:

# A cancelled workflow must not be reported as a pass.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --frozen-lockfile
          if ! git diff --exit-code --quiet -- package-lock.json; then
            echo "package-lock.json changed during npm ci; commit the updated lockfile." >&2
            exit 1
          fi
      - name: Lint (no database required)
        run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --frozen-lockfile
          if ! git diff --exit-code --quiet -- package-lock.json; then
            echo "package-lock.json changed during npm ci; commit the updated lockfile." >&2
            exit 1
          fi
      - name: Type check (compiles the shared package first)
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --frozen-lockfile
          if ! git diff --exit-code --quiet -- package-lock.json; then
            echo "package-lock.json changed during npm ci; commit the updated lockfile." >&2
            exit 1
          fi
      - name: Unit tests with coverage
        run: npm run test:coverage --workspace @nexuserp/api
      - name: Web component tests
        run: npm run test:coverage --workspace @nexuserp/web
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage/
          if-no-files-found: warn

  integration:
    name: Integration tests (real PostgreSQL)
    runs-on: ubuntu-latest
    # T111: no `if:` condition. A job that can be skipped can also be skipped past its
    # own failures, so this job always runs and its failures propagate through `needs`.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexuserp
          POSTGRES_PASSWORD: nexuserp
          POSTGRES_DB: nexuserp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U nexuserp -d nexuserp
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nexuserp:nexuserp@127.0.0.1:5432/nexuserp?schema=public
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret-0123456789
      CSRF_SECRET: ci-csrf-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --frozen-lockfile
          if ! git diff --exit-code --quiet -- package-lock.json; then
            echo "package-lock.json changed during npm ci; commit the updated lockfile." >&2
            exit 1
          fi
      - name: Apply migrations
        run: npm run db:migrate
      - name: Integration tests
        run: npm run test:integration

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexuserp
          POSTGRES_PASSWORD: nexuserp
          POSTGRES_DB: nexuserp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U nexuserp -d nexuserp
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nexuserp:nexuserp@127.0.0.1:5432/nexuserp?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --frozen-lockfile
          if ! git diff --exit-code --quiet -- package-lock.json; then
            echo "package-lock.json changed during npm ci; commit the updated lockfile." >&2
            exit 1
          fi
      - name: Empty database applies cleanly
        run: npm run db:migrate
      - name: Re-applying changes no data
        run: npm run db:migrate
      - name: Applied history matches the repository
        run: npm run check:migrations

  contract:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --frozen-lockfile
          if ! git diff --exit-code --quiet -- package-lock.json; then
            echo "package-lock.json changed during npm ci; commit the updated lockfile." >&2
            exit 1
          fi
      - name: Build the service
        run: npm run build --workspace @nexuserp/api
      - name: Committed contract matches the source
        run: npm run openapi:diff

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --frozen-lockfile
          if ! git diff --exit-code --quiet -- package-lock.json; then
            echo "package-lock.json changed during npm ci; commit the updated lockfile." >&2
            exit 1
          fi
      - name: Build shared, service and web
        run: npm run build

  images:
    name: Image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the service image
        run: docker build -f docker/api.Dockerfile -t nexuserp-api:ci .
      - name: Build the web image
        run: docker build -f docker/web.Dockerfile -t nexuserp-web:ci .

  workflow:
    name: Workflow assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The workflow pushes nothing and deploys nothing
        run: node .github/workflows/__tests__/ci-no-deploy.spec.ts