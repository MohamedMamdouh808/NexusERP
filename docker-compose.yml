# NexusERP development environment.
#
# FR-005: ONE documented command starts the database, the service, and the interface
# together, from a clean checkout with no preinstalled database:
#
#     cp .env.example .env
#     docker compose up -d --wait
#
# `--wait` returns only after every service reports healthy. Readiness is DECLARED, not
# timed: the service is not considered started until the database has answered
# `pg_isready` (FR-007). Without the healthcheck the service would crash-loop against a
# database that is still initialising, and the developer would see a container that stops
# for no visible reason.
#
# FR-006: the PostgreSQL major version is PINNED and must match the managed PostgreSQL used
# in production. A migration that passes against a different major version can still fail
# in production, which is why the tag is explicit rather than `latest` or `17`.
#
# FR-008: the database uses a NAMED VOLUME, so `docker compose down` (without `-v`)
# preserves data and re-running the startup command creates no duplicates and loses
# nothing.
#
# FR-050a/FR-050b: this environment never deploys and never pushes an image anywhere. The
# images are portable and host-agnostic so the hosting platform can be chosen later
# without restructuring (see research.md R-019).

name: nexuserp

services:
  db:
    # Pinned major version, matching production. Do not change without checking the
    # managed offering, or a migration can pass here and fail there.
    image: postgres:17-alpine
    container_name: nexuserp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexuserp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexuserp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexuserp}
      # Deterministic collation, so ordering does not differ between a developer
      # machine and production for the same data.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Bound to loopback only: a development database must never be reachable from the
      # network. Host port 5432 is overridable if the host already uses it.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # FR-008: named volume, so `docker compose down` preserves data.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexuserp} -d ${POSTGRES_DB:-nexuserp}']
      interval: 5s
      timeout: 5s
      # Generous start period: the first initialise on an empty volume takes longer than
      # a warm restart, and a too-short period marks a starting container unhealthy.
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: nexuserp-api
    restart: unless-stopped
    depends_on:
      db:
        # FR-007: the service does not start until the database is actually ready,
        # rather than retrying blindly and logging a wall of connection errors.
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexuserp}:${POSTGRES_PASSWORD:-nexuserp_dev_password}@db:5432/${POSTGRES_DB:-nexuserp}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-development-placeholder-not-used-yet}
      CSRF_SECRET: ${CSRF_SECRET:-development-placeholder-not-used-yet}
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    healthcheck:
      # The health endpoint is public by design and reports database state separately, so
      # this probe also proves the container can reach the database.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: nexuserp-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_HOST_PORT:-5173}:5173'
    environment:
      # The dev server proxies /api to the service, so the browser sees one origin and no
      # component hardcodes an API host.
      VITE_API_PROXY_TARGET: http://api:3000
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
    name: nexuserp-postgres-data
